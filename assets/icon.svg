<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Premium Dark Athletic Background -->
  <rect width="512" height="512" rx="110" fill="#111827"/>
  
  <!-- The Dynamic Kinetic Peak / Progress Arrow -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Ascending Line (Foundation) -->
    <path d="M120 360 L190 240 L240 310" 
          stroke="#9CA3AF" 
          stroke-width="44" 
          fill="none"/>
          
    <!-- Main Upward Pulse (The Breakthrough) -->
    <path d="M240 310 L320 140 L400 360" 
          stroke="#FF4500" 
          stroke-width="52" 
          fill="none"/>
          
    <!-- Glowing Accent Dot (The Goal/Target) -->
    <circle cx="320" cy="140" r="12" fill="#FFFFFF"/>
  </g>
</svg>
